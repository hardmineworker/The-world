<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earth Test - Minimal</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#001933;overflow:hidden;font-family:sans-serif;color:#fff;}
  #glCanvas{display:block;width:100%;height:100%;}
  #loaderWrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:20px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;}
  #loaderBarInner{width:0%;height:100%;background:linear-gradient(90deg,#8ae6ff,#4fffd8);transition:width 200ms linear;}
  #console{position:fixed;bottom:0;left:0;width:100%;max-height:150px;overflow-y:auto;background:rgba(0,0,0,0.8);color:#0f0;font-size:12px;padding:5px;}
</style>
</head>
<body>
<canvas id="glCanvas"></canvas>
<div id="loaderWrap"><div id="loaderBarInner"></div></div>
<div id="console"></div>

<script type="module">
// -----------------------------
// log function
// -----------------------------
function log(msg){
  const consoleDiv=document.getElementById('console');
  const p=document.createElement('div');
  p.textContent=msg;
  consoleDiv.appendChild(p);
  consoleDiv.scrollTop=consoleDiv.scrollHeight;
}

// -----------------------------
// Three.js imports
// -----------------------------
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// -----------------------------
// Renderer & Scene & Camera
// -----------------------------
const canvas=document.getElementById('glCanvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

const scene=new THREE.Scene();
scene.background=null;

const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(0,0,3);

// -----------------------------
// Controls
// -----------------------------
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.enablePan=false;

// -----------------------------
// Light
// -----------------------------
const ambient=new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);
const dirLight=new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(5,3,5);
scene.add(dirLight);

// -----------------------------
// Loader Manager
// -----------------------------
const loaderManager=new THREE.LoadingManager();
loaderManager.onProgress=(url,itemsLoaded,itemsTotal)=>{
  const pct=Math.round((itemsLoaded/itemsTotal)*100);
  const bar=document.getElementById('loaderBarInner');
  bar.style.width=pct+'%';
};
loaderManager.onLoad=()=>{
  setTimeout(()=>{document.getElementById('loaderWrap').style.display='none';},300);
};
loaderManager.onError=(url)=>{
  log("Loading error:"+url);
};

// -----------------------------
// Texture Loader
// -----------------------------
const texLoader=new THREE.TextureLoader(loaderManager);
const earthTexture=texLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');

// -----------------------------
// Earth Mesh
// -----------------------------
const earthGeo=new THREE.SphereGeometry(1,64,64);
const earthMat=new THREE.MeshPhongMaterial({map:earthTexture});
const earthMesh=new THREE.Mesh(earthGeo,earthMat);
scene.add(earthMesh);

// -----------------------------
// Animation Loop
// -----------------------------
let last=0;
function animate(now){
  const dt=(now-last)/1000||0;
  last=now;
  earthMesh.rotation.y+=0.2*dt;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// -----------------------------
// Responsive
// -----------------------------
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// -----------------------------
// Alive log every 10 sec
// -----------------------------
setInterval(()=>{log("Alive: Earth scene running")},10000);
</script>
</body>
</html>
