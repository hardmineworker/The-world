<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>3D Earth Demo</title>
<style>
:root {
  --bg1:#04021a; --bg2:#001933; --accent:#8ae6ff; --ui-bg: rgba(255,255,255,0.04);
}
html,body{height:100%;margin:0;padding:0;overflow:hidden;font-family:Inter,"Noto Sans KR",system-ui;}
body{background:radial-gradient(ellipse at 20% 10%, rgba(138,230,255,0.02), transparent 10%),linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 90%);color:#e6f7ff;}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;display:block;}
canvas{display:block;width:100%;height:100%;}
#loaderWrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;max-width:520px;background:rgba(255,255,255,0.04);border-radius:16px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,0.6);z-index:60;backdrop-filter:blur(6px);}
#loaderLabel{font-size:13px;color:var(--accent);margin-bottom:8px;text-align:center;}
#loaderBarOuter{width:100%;height:14px;background:rgba(255,255,255,0.03);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,0.03);}
#loaderBarInner{width:0%;height:100%;background:linear-gradient(90deg,var(--accent),#4fffd8);transition:width 180ms linear;}
#topInfo{position:absolute;left:12px;top:12px;z-index:70;padding:8px 12px;background:rgba(0,0,0,0.22);border-radius:10px;color:#cceeff;font-size:13px;border:1px solid rgba(255,255,255,0.03);backdrop-filter:blur(4px);}
#controls{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:10px;z-index:70;align-items:center;justify-content:center;pointer-events:auto;}
.controlBtn{background:var(--ui-bg);border:1px solid rgba(255,255,255,0.06);color:var(--accent);padding:10px 14px;border-radius:12px;font-weight:600;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,0.55);cursor:pointer;user-select:none;}
.controlBtn:active{transform:translateY(1px) scale(0.997);}
.small{padding:8px 10px;font-size:13px;}
@media(min-width:1024px){#controls{left:auto;right:18px;bottom:18px;transform:none;flex-direction:column;}#loaderWrap{width:46%;max-width:640px;}}
@media(max-width:420px){#loaderWrap{width:88%;padding:10px;border-radius:12px;}.controlBtn{padding:10px 12px;font-size:13px;}}
#console{position:fixed;bottom:0;left:0;width:100%;max-height:150px;overflow-y:scroll;background:rgba(0,0,0,0.8);color:#0f0;font-size:12px;padding:5px;z-index:9999;}
</style>
</head>
<body>
<div id="app">
<canvas id="glCanvas" aria-hidden="false"></canvas>
<div id="loaderWrap" role="status" aria-live="polite">
  <div id="loaderLabel">Loading textures & data...</div>
  <div id="loaderBarOuter"><div id="loaderBarInner" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
</div>
<div id="topInfo">Ping: -- ms | User: Guest</div>
<div id="controls">
<button class="controlBtn small" id="btnZoom">확대/축소</button>
<button class="controlBtn small" id="btnRotate">자동 회전 On</button>
<button class="controlBtn small" id="btnBorders">국경선 On/Off</button>
<button class="controlBtn small" id="btnDetail">디테일 단계</button>
</div>
</div>
<div id="console"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('glCanvas');
const loaderWrap=document.getElementById('loaderWrap');
const loaderInner=document.getElementById('loaderBarInner');
const btnZoom=document.getElementById('btnZoom');
const btnRotate=document.getElementById('btnRotate');
const btnBorders=document.getElementById('btnBorders');
const btnDetail=document.getElementById('btnDetail');
const topInfo=document.getElementById('topInfo');
const consoleDiv=document.getElementById('console');

function log(msg){const p=document.createElement('div');p.textContent=msg;consoleDiv.appendChild(p);consoleDiv.scrollTop=consoleDiv.scrollHeight;}

const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.background=null;

const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,200);
function setCameraForViewport(){const w=window.innerWidth;if(w<=420)camera.position.set(0,0,2.6);else if(w<=768)camera.position.set(0,0,3.2);else if(w<=1024)camera.position.set(0,0,3.8);else camera.position.set(0,0,4.6);}
setCameraForViewport();

const controls=new OrbitControls(camera,renderer.domElement);
controls.enablePan=false;controls.enableDamping=true;controls.dampingFactor=0.08;controls.rotateSpeed=0.6;controls.zoomSpeed=0.9;controls.minDistance=1.2;controls.maxDistance=12;

scene.add(new THREE.AmbientLight(0xffffff,0.55));
const dirLight=new THREE.DirectionalLight(0xffffff,0.95);dirLight.position.set(5,3,5);scene.add(dirLight);

const loadingManager=new THREE.LoadingManager();
loadingManager.onProgress=(url,loaded,total)=>{const pct=Math.round((loaded/total)*100);loaderInner.style.width=pct+'%';loaderInner.setAttribute('aria-valuenow',pct.toString());};
loadingManager.onLoad=()=>{setTimeout(()=>{loaderWrap.style.display='none';},300);};
loadingManager.onError=(url)=>{log('Loading error: '+url);topInfo.textContent='텍스처 불러오기 실패';};

const texLoader=new THREE.TextureLoader(loadingManager);

const TEXTURES={
base:{map:'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',bump:'https://threejs.org/examples/textures/planets/earthbump1k.jpg',spec:'https://threejs.org/examples/textures/planets/earthspec1k.jpg',clouds:'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'},
detail2:{map:'https://raw.githubusercontent.com/planetarymaps/planetary-maps/main/earth/earthmap4k.jpg',bump:'https://threejs.org/examples/textures/planets/earthbump1k.jpg',spec:'https://threejs.org/examples/textures/planets/earthspec1k.jpg'},
detail3:{map:'https://raw.githubusercontent.com/jeromeetienne/threex.planets/master/images/earthmap1k.jpg',bump:'https://threejs.org/examples/textures/planets/earthbump1k.jpg',spec:'https://threejs.org/examples/textures/planets/earthspec1k.jpg'}
};

const baseMap=texLoader.load(TEXTURES.base.map);
const baseBump=texLoader.load(TEXTURES.base.bump);
const baseSpec=texLoader.load(TEXTURES.base.spec);
const baseCloud=texLoader.load(TEXTURES.base.clouds);

const earthGroup=new THREE.Group();scene.add(earthGroup);

const RADIUS=1.0,SEG=64;
const earthMesh=new THREE.Mesh(new THREE.SphereGeometry(RADIUS,SEG,SEG),
  new THREE.MeshPhongMaterial({map:baseMap,bumpMap:baseBump,bumpScale:0.045,specularMap:baseSpec,specular:new THREE.Color(0x444444),shininess:6})
);earthGroup.add(earthMesh);

const cloudsMesh=new THREE.Mesh(new THREE.SphereGeometry(RADIUS*1.008,SEG,SEG),
  new THREE.MeshLambertMaterial({map:baseCloud,transparent:true,opacity:0.9,depthWrite:false})
);earthGroup.add(cloudsMesh);

let bordersGroup=null;
async function loadBorders(url='https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson'){
  try{
    const res=await fetch(url);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const geo=await res.json();
    const group=new THREE.Group();
    const lineMat=new THREE.LineBasicMaterial({color:0x8ee6ff,linewidth:1,transparent:true,opacity:0.9});
    for(const f of geo.features){
      const geom=f.geometry;if(!geom)continue;
      if(geom.type==='Polygon')buildLinesFromPolygon(geom.coordinates,group,lineMat);
      else if(geom.type==='MultiPolygon')for(const poly of geom.coordinates)buildLinesFromPolygon(poly,group,lineMat);
    }
    group.name='borders';group.scale.set(1.002,1.002,1.002);group.visible=false;
    bordersGroup=group;earthGroup.add(bordersGroup);
  }catch(err){log('Failed to load borders');topInfo.textContent='국경선 불러오기 실패: '+err.message;console.error(err);}
function buildLinesFromPolygon(coords,group,mat){
  for(const ring of coords){
    const points=[];
    for(const [lon,lat] of ring){
      const phi=(90-lat)*Math.PI/180;
      const theta=(lon+180)*Math.PI/180;
      const x=RADIUS*Math.sin(phi)*Math.cos(theta);
      const y=RADIUS*Math.cos(phi);
      const z=RADIUS*Math.sin(phi)*Math.sin(theta);
      points.push(new THREE.Vector3(x,y,z));
    }
    const lineGeom=new THREE.BufferGeometry().setFromPoints(points);
    group.add(new THREE.Line(lineGeom,mat));
  }
}

loadBorders(); // 초기 국경선 로드

// 상태 변수
let autoRotate=true;
let detailLevel=1;

// UI 이벤트
btnRotate.addEventListener('click',()=>{
  autoRotate=!autoRotate;
  btnRotate.textContent='자동 회전 '+(autoRotate?'On':'Off');
  log('자동 회전: '+autoRotate);
});

btnZoom.addEventListener('click',()=>{
  camera.position.z=camera.position.z>2?1.6:4.6;
  log('카메라 줌: '+camera.position.z.toFixed(2));
});

btnBorders.addEventListener('click',()=>{
  if(bordersGroup){bordersGroup.visible=!bordersGroup.visible;log('국경선: '+bordersGroup.visible);}
});

btnDetail.addEventListener('click',()=>{
  detailLevel=(detailLevel%3)+1;
  switch(detailLevel){
    case 1: earthMesh.material.map=baseMap; earthMesh.material.bumpMap=baseBump; earthMesh.material.specularMap=baseSpec; break;
    case 2: earthMesh.material.map=texLoader.load(TEXTURES.detail2.map); earthMesh.material.bumpMap=texLoader.load(TEXTURES.detail2.bump); earthMesh.material.specularMap=texLoader.load(TEXTURES.detail2.spec); break;
    case 3: earthMesh.material.map=texLoader.load(TEXTURES.detail3.map); earthMesh.material.bumpMap=texLoader.load(TEXTURES.detail3.bump); earthMesh.material.specularMap=texLoader.load(TEXTURES.detail3.spec); break;
  }
  earthMesh.material.needsUpdate=true;
  log('디테일 단계: '+detailLevel);
});

// 리사이즈 대응
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  setCameraForViewport();
  log('리사이즈: '+window.innerWidth+'x'+window.innerHeight);
});

// 애니메이션 루프
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  if(autoRotate){earthGroup.rotation.y+=delta*0.08;cloudsMesh.rotation.y+=delta*0.1;}
  controls.update();
  renderer.render(scene,camera);
}
animate();

// 콘솔 Alive 메시지 10초마다
setInterval(()=>{log('System alive: '+new Date().toLocaleTimeString());},10000);

// 초기 로드 완료 메시지
log('3D 지구 로드 완료');

// 예외 처리
window.addEventListener('error',e=>log('Error: '+e.message));
window.addEventListener('unhandledrejection',e=>log('Promise rejection: '+e.reason));

</script>
</body>
</html>
