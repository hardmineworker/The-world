<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Interactive 3D Earth with UI Console</title>
<style>
  :root {
    --bg1: #04021a;
    --bg2: #001933;
    --accent: #8ae6ff;
    --ui-bg: rgba(255,255,255,0.04);
  }
  html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    font-family: Inter, "Noto Sans KR", sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    overflow:hidden;
  }

  #app { position:relative; width:100vw; height:100vh; }

  canvas#glCanvas { width:100%; height:100%; display:block; }

  /* Loader bar */
  #loaderWrap {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:72%; max-width:520px; background: var(--ui-bg);
    border-radius:16px; padding:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    z-index:50; backdrop-filter:blur(6px);
  }
  #loaderLabel { color:var(--accent); text-align:center; margin-bottom:6px; font-size:13px; }
  #loaderBarOuter { width:100%; height:14px; background: rgba(255,255,255,0.03); border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,0.03);}
  #loaderBarInner { width:0%; height:100%; background: linear-gradient(90deg,var(--accent), #4fffd8); transition: width 180ms linear; }

  /* Controls */
  #controls { position:absolute; bottom:16px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:70; }
  .controlBtn { background: var(--ui-bg); border:1px solid rgba(255,255,255,0.06); color:var(--accent); padding:8px 12px; border-radius:12px; cursor:pointer; user-select:none; font-size:13px; }
  .controlBtn:active{ transform: scale(0.98); }

  /* Top-left / top-right placeholders */
  #ping { position:absolute; top:12px; left:12px; color:#8ae6ff; font-size:13px; z-index:70; }
  #userInfo { position:absolute; top:12px; right:12px; color:#8ae6ff; font-size:13px; z-index:70; }

  /* Internal console */
  #consoleUI {
    position:absolute; bottom:0; left:0; width:100%; max-height:180px; overflow-y:auto;
    background:rgba(0,0,0,0.6); color:#8ae6ff; font-size:12px; padding:6px;
    font-family: monospace; z-index:100; box-sizing:border-box;
  }

</style>
</head>
<body>
<div id="app">
  <canvas id="glCanvas"></canvas>

  <div id="loaderWrap">
    <div id="loaderLabel">Loading textures...</div>
    <div id="loaderBarOuter"><div id="loaderBarInner"></div></div>
  </div>

  <div id="ping">Ping: -- ms</div>
  <div id="userInfo">User: Guest</div>

  <div id="controls">
    <button class="controlBtn" id="btnRotate">자동 회전 On</button>
    <button class="controlBtn" id="btnZoom">확대/축소</button>
  </div>

  <div id="consoleUI"></div>
</div>

<script type="module">
// --- Three.js 로드 CDN ---
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

// --- DOM 요소 ---
const canvas = document.getElementById('glCanvas');
const loaderWrap = document.getElementById('loaderWrap');
const loaderBarInner = document.getElementById('loaderBarInner');
const btnRotate = document.getElementById('btnRotate');
const btnZoom = document.getElementById('btnZoom');
const consoleUI = document.getElementById('consoleUI');

// --- 콘솔 출력 함수 ---
function logUI(msg, type='log') {
  const el = document.createElement('div');
  el.textContent = `[${type}] ${msg}`;
  el.style.color = type==='error'?'#ff6666':'#8ae6ff';
  consoleUI.appendChild(el);
  consoleUI.scrollTop = consoleUI.scrollHeight;
}
window.logUI = logUI;

// --- 기존 console 가로채기 ---
['log','error','warn'].forEach(fn=>{
  const old = console[fn];
  console[fn] = (...args)=>{
    old(...args);
    logUI(args.join(' '), fn);
  }
});

// --- Renderer, Scene, Camera ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0,0,3.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan=false;
controls.enableDamping=true;

// --- Light ---
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dirLight = new THREE.DirectionalLight(0xffffff,0.9);
dirLight.position.set(5,3,5);
scene.add(dirLight);

// --- Earth Sphere (단순 색상) ---
const earthGeo = new THREE.SphereGeometry(1,64,64);
const earthMat = new THREE.MeshPhongMaterial({ color:0x2266ff, shininess:5 });
const earthMesh = new THREE.Mesh(earthGeo, earthMat);
scene.add(earthMesh);

// --- Loader 시뮬레이션 ---
let loadPct=0;
function fakeLoad() {
  if(loadPct>=100){ loaderWrap.style.display='none'; return; }
  loadPct += Math.random()*4; // 조금씩 올라가게
  if(loadPct>100) loadPct=100;
  loaderBarInner.style.width = loadPct+'%';
  requestAnimationFrame(fakeLoad);
}
fakeLoad();

// --- UI 버튼 ---
let autoRotate = true;
btnRotate.onclick = ()=>{
  autoRotate = !autoRotate;
  btnRotate.textContent = autoRotate?'자동 회전 On':'자동 회전 Off';
}
let zoomedIn = false;
btnZoom.onclick = ()=>{
  zoomedIn = !zoomedIn;
  camera.position.z = zoomedIn?1.8:3.5;
}

// --- 애니메이션 루프 ---
function animate(now){
  requestAnimationFrame(animate);
  if(autoRotate) earthMesh.rotation.y += 0.002;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// --- 화면 리사이즈 대응 ---
window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- 10초 단위 로그 ---
setInterval(()=>{
  console.log('10초 경과: Earth is running normally.');
}, 10000);

// --- 예외 시 자동 표시 ---
window.addEventListener('error', e=>{
  console.error('Error caught:', e.message);
});

console.log('3D Earth UI initialized.');

</script>
</body>
</html>
